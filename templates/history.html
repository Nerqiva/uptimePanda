{% extends "layout.html" %}
{% block content %}
<div class="card">
  <div class="chiprow" role="group" aria-label="Filter by outcome">
    {% for chip in outcome_chips %}<a class="chip{% if chip.active %} active{% endif %}" href="{{ chip.href }}">{{ chip.label }}</a>{% endfor %}
  </div>
  <form method="get" action="/history" class="log-toolbar">
    <div class="session-picker">
      <div class="field">
        <span>Website</span>
        <select name="website_id">
          <option value="">All websites</option>
          {% for w in websites %}<option value="{{ w.id }}"{% if w.id == selected_website %} selected{% endif %}>{{ w.name }}</option>{% endfor %}
        </select>
      </div>
      <input type="hidden" name="outcome" value="{{ selected_outcome }}">
      <button class="btn" type="submit">Apply</button>
    </div>
    <p class="muted">{{ total }} row(s) · 20 per page</p>
  </form>
  <div id="history-wrap">
    {% set oob = false %}
    {% include "partials/history_rows.html" %}
  </div>
</div>
{% endblock %}
