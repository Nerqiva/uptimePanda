name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  # Let multi-arch image builds run to completion instead of cancelling
  # them on the next push; superseded-but-green pushes are wasteful but safe.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: uptimepanda

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Release build
        run: cargo build --locked --release

  docker:
    needs: test
    runs-on: ubuntu-latest
    # QEMU-emulated arm64 Rust release builds can exceed 30 minutes; the
    # relaxed release profile (lto=false, codegen-units=16) keeps this
    # comfortably below the old budget, but allow headroom.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Image tag = the VERSION file (single source of truth). Counting
      # tags independently of the release workflow made the image tag drift
      # by one bump; VERSION parity guarantees image == release.
      - name: Read image tag from VERSION
        id: calver
        run: |
          set -eu
          echo "calver=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.repo }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.calver.outputs.calver }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=uptimePanda
            org.opencontainers.image.description=Rust + Lightpanda synthetic website monitor (512MB/0.15 vCPU)

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GITHUB_SHA=${{ github.sha }}
